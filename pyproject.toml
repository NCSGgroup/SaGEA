[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sagea"
version = "0.3.3"
description = "satellite gravity post-processing and error assessment"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Shuhao Liu", email = "liushuhao@apm.ac.cn" },
]
keywords = ["geodesy", "gravity", "GRACE", "satellite", "SH"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "scipy>=1.17.0",
    "numpy>=2.4.3",
    "cartopy>=0.25.0; sys_platform != 'emscripten'",
    "geopandas>=1.1.4; sys_platform != 'emscripten'",
    "matplotlib>=3.11.1; sys_platform != 'emscripten'",
    "netcdf4>=1.7.4; sys_platform != 'emscripten'",
    "rasterio>=1.5.0; sys_platform != 'emscripten'",
    "Shapely>=2.1.2; sys_platform != 'emscripten'",
    "h5py>=3.16.0; sys_platform != 'emscripten'",
    "wget>=3.2; sys_platform != 'emscripten'",
    "affine>=2.4.0; sys_platform != 'emscripten'",
]

# Optional Dependencies
# Usage: pip install sagea[full]
[project.optional-dependencies]
full = []


[project.urls]
"Homepage" = "https://github.com/NCSGgroup/SaGEA"
"Bug Tracker" = "https://github.com/NCSGgroup/SaGEA/issues"


# Once installed, executing `sagea-proc` in the terminal runs the `main` function in `sagea.cli`
[project.scripts]
sagea-proc = "sagea.cli:main"

# -----------------------------------------------------------------------
# Tool Configuration Section: Integrate configs for other tools here
# -----------------------------------------------------------------------

# Setuptools specific config: Required for src-layout
[tool.setuptools.packages.find]
where = ["src"]
include = ["sagea*"]  # Include "sagea" and its sub-packages

# Include package data files (e.g., json and nc files under sagea/data/)
[tool.setuptools.package-data]
"sagea" = ["data/auxiliary/*"]
[tool.setuptools.exclude-package-data]
"sagea" = ["data/ddk_data/*"]

